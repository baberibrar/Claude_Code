<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in – Focusdoro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --hero-bg  : linear-gradient(140deg,#f5f3ff 0%,#ede9fe 45%,#e0e7ff 100%);
      --card-bg  : rgba(255,255,255,.85);
      --card-bdr : rgba(255,255,255,.92);
      --body-text: #111827;
      --label-c  : #374151;
      --muted-c  : #6b7280;
      --input-bg : #ffffff;
      --input-bdr: #e5e7eb;
      --ghost-bg : #f9fafb;
    }
    [data-theme="dark"] {
      --hero-bg  : linear-gradient(140deg,#1e1b4b 0%,#1a1535 50%,#120f28 100%);
      --card-bg  : rgba(255,255,255,.06);
      --card-bdr : rgba(255,255,255,.08);
      --body-text: #f9fafb;
      --label-c  : #d1d5db;
      --muted-c  : #9ca3af;
      --input-bg : rgba(255,255,255,.06);
      --input-bdr: rgba(255,255,255,.12);
      --ghost-bg : rgba(255,255,255,.04);
    }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: var(--hero-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--body-text);
      transition: background .3s, color .3s;
    }

    /* ── Card ──────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-bdr);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 48px -12px rgba(99,102,241,.18);
    }

    /* ── OAuth buttons ────────────────────────────────────── */
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
      text-decoration: none;
    }
    .oauth-google {
      background: var(--input-bg);
      border: 1.5px solid var(--input-bdr);
      color: var(--label-c);
    }
    .oauth-google:hover { background: var(--ghost-bg); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

    .oauth-github {
      background: #111827;
      border: 1.5px solid #111827;
      color: #fff;
    }
    .oauth-github:hover { background: #1f2937; }

    /* ── Divider ──────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #9ca3af;
      font-size: .8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    /* ── Input ────────────────────────────────────────────── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field label {
      font-size: .8125rem;
      font-weight: 500;
      color: var(--label-c);
    }
    .field input {
      padding: 10px 14px;
      border: 1.5px solid var(--input-bdr);
      border-radius: 10px;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .3s, color .3s;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--body-text);
    }
    .field input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }

    /* ── Primary button ───────────────────────────────────── */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(99,102,241,.35);
    }
    .btn-primary:hover { background: #4f46e5; }
  </style>
  <script>
    // Sync theme with main page before paint
    (function(){
      const t = localStorage.getItem('fd-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <!-- Back link -->
  <a href="index.html"
    style="display:flex;align-items:center;gap:6px;color:#6b7280;font-size:.875rem;font-weight:500;text-decoration:none;margin-bottom:28px;transition:color .15s;"
    onmouseover="this.style.color='#6366f1'" onmouseout="this.style.color='#6b7280'">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
    </svg>
    Back to app
  </a>

  <div class="card">

    <!-- Logo + heading -->
    <div style="text-align:center;margin-bottom:28px;">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:20px;">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#6366f1" stroke-width="2.5"/>
          <path d="M16 9v7l4 4" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span style="font-weight:800;font-size:1.1rem;color:#111827;">Focusdoro</span>
      </a>
      <h1 style="font-size:1.4rem;font-weight:800;color:#111827;margin-bottom:6px;">Welcome back</h1>
      <p style="font-size:.875rem;color:#6b7280;">Sign in to sync your settings across devices</p>
    </div>

    <!-- OAuth -->
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
      <button class="oauth-btn oauth-google">
        <!-- Google icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <button class="oauth-btn oauth-github">
        <!-- GitHub icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        Continue with GitHub
      </button>
    </div>

    <!-- Divider -->
    <div class="divider" style="margin-bottom:20px;">or continue with email</div>

    <!-- Email form -->
    <form onsubmit="handleSignin(event)" style="display:flex;flex-direction:column;gap:14px;">

      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email"/>
      </div>

      <div class="field">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <label>Password</label>
          <a href="#" style="font-size:.75rem;color:#6366f1;text-decoration:none;font-weight:500;"
            onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
            Forgot password?
          </a>
        </div>
        <div style="position:relative;">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" style="width:100%;box-sizing:border-box;padding-right:42px;"/>
          <button type="button" onclick="togglePwd()" title="Show/hide password"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;padding:0;display:flex;align-items:center;"
            onmouseover="this.style.color='#374151'" onmouseout="this.style.color='#9ca3af'">
            <svg id="eye-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="margin-top:4px;">
        Sign in
      </button>
    </form>

    <!-- Sign up link -->
    <p style="text-align:center;font-size:.8125rem;color:#6b7280;margin-top:20px;">
      Don't have an account?
      <a href="#" style="color:#6366f1;font-weight:600;text-decoration:none;"
        onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
        Sign up free
      </a>
    </p>

  </div>

  <!-- Footer note -->
  <p style="margin-top:20px;font-size:.75rem;color:#9ca3af;text-align:center;">
    By signing in you agree to our
    <a href="#" style="color:#6b7280;text-decoration:underline;">Terms</a> and
    <a href="#" style="color:#6b7280;text-decoration:underline;">Privacy Policy</a>.
  </p>

  <script>
    function togglePwd() {
      const inp  = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;
      } else {
        inp.type = 'password';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
      }
    }

    function handleSignin(e) {
      e.preventDefault();
      const btn = e.submitter;
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      btn.style.opacity = '.7';
      // Simulate async – in a real app this would call the auth API
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1200);
    }
  </script>

</body>
</html>
